<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EquiPower</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/png" href="assets/logos/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&display=swap"
  >
  <style>
    :root {
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 30%, rgba(176, 141, 87, 0.1), transparent 55%),
        #faf6ee;
      font-family: "Fraunces", Didot, "Bodoni 72", Georgia, serif;
    }

    main {
      width: min(90vw, 720px);
      display: grid;
      place-items: center;
      padding: 2rem;
      text-align: center;
    }

    img {
      display: block;
      width: 100%;
      max-width: min(70vw, 300px);
      height: auto;
    }

    p {
      margin: 1.75rem 0 0;
      color: #7c6f60;
      font-size: 1.05rem;
      font-style: italic;
      letter-spacing: 0.03em;
    }

    .rule {
      width: 3rem;
      height: 1px;
      margin-top: 1.75rem;
      background: #b08d57;
    }
  </style>
</head>
<body>
  <main>
    <img src="assets/logos/equipower_logo_transparent.png" alt="EquiPower logo">
    <div class="rule"></div>
    <p>Des produits essentiels pour le quotidien à l'écurie.</p>
  </main>
</body>
</html>
