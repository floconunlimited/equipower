<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EquiPower</title>
  <style>
    :root {
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #fbfbfb;
      font-family: Georgia, "Times New Roman", serif;
    }

    main {
      width: min(90vw, 720px);
      display: grid;
      place-items: center;
      padding: 2rem;
    }

    img {
      display: block;
      width: 100%;
      max-width: min(70vw, 420px);
      height: auto;
    }
  </style>
</head>
<body>
  <main>
    <img src="./equipower_logo.png" alt="EquiPower logo">
  </main>
</body>
</html>
