<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EquiPower</title>
  <style>
    :root {
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #fbfbfb;
      font-family: Georgia, "Times New Roman", serif;
    }

    main {
      width: min(90vw, 720px);
      display: grid;
      place-items: center;
      padding: 2rem;
    }

    img {
      display: block;
      width: 100%;
      max-width: min(70vw, 320px);
      height: auto;
    }

    p {
      margin: 1.5rem 0 0;
      color: #5f6b68;
      font-size: 0.95rem;
      letter-spacing: 0.04em;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 1.5rem;
      padding: 0 1.5rem;
      min-height: 3rem;
      background: #233432;
      color: #fff;
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      text-decoration: none;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <main>
    <img src="assets/logos/equipower_logo_transparent.png" alt="EquiPower logo">
    <p>Des produits essentiels pour le quotidien à l'écurie.</p>
    <a href="index_hidden.html">Découvrir la boutique</a>
  </main>
</body>
</html>
